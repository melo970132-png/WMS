<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>捷元WMS</title>

    <link rel="apple-touch-icon" href="https://i.postimg.cc/Rh0cxPcn/JHW.png">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        /* 消除所有白邊，鎖定全螢幕 100% 物理尺寸 */
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #f4f6f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        
        body {
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            text-align: center;
        }

        /* 系統啟動轉圈圈 */
        .splash-spinner {
            width: 40px; height: 40px; 
            border: 3px solid rgba(146, 172, 209, 0.3); 
            border-top-color: #92acd1; border-radius: 50%; 
            animation: spin 1s linear infinite; margin: 0 auto 16px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* 提示安裝的文字樣式 */
        .install-msg { color: #2c3e50; font-size: 16px; line-height: 1.6; margin-bottom: 30px; padding: 0 24px; }
        .install-btn { background: #1a73e8; color: white; padding: 14px 28px; border-radius: 12px; text-decoration: none; font-weight: bold; font-size: 14px; box-shadow: 0 4px 12px rgba(26,115,232,0.3); }

        /* 🌟 核心靈魂：100% 全幅無邊框 Iframe */
        #wms-app-frame {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            border: none; margin: 0; padding: 0;
            z-index: 999; display: none; /* 初始隱藏，載入完才顯示 */
        }
    </style>

    <script>
        // 🚀 你的 Google Apps Script 網址
        const gasUrl = "https://script.google.com/macros/s/AKfycbz7JILdEj3U2bt_HCO8HolrVo0J_hHTj1D1ciN-h83A3BVfU6gTLUgFiPUn9xfPI0jWCw/exec";
    </script>
</head>
<body>

    <div id="loading-screen" style="display:none;">
        <div class="splash-spinner"></div>
        <div style="font-size: 15px; font-weight: 600; color: #92acd1; letter-spacing: 1px;">系統啟動中...</div>
    </div>

    <div id="install-screen">
        <div class="install-msg">
            <span style="font-size: 45px; display: block; margin-bottom: 16px;">📦</span>
            請點擊瀏覽器下方分享按鈕<br>
            選擇 <b>「加入主畫面」</b><br>
            即可解鎖原生全螢幕 WMS 體驗
        </div>
        <a href="#" class="install-btn" id="manual-link">直接進入系統</a>
    </div>

    <iframe id="wms-app-frame" src=""></iframe>

    <script>
        document.getElementById('manual-link').href = gasUrl;

        // 🧠 核心智慧判斷：是否為桌面 Standalone 模式開起
        if (window.navigator.standalone === true) {
            // 1. 桌面模式：隱藏安裝提示，顯示轉圈圈
            document.getElementById('install-screen').style.display = 'none';
            document.getElementById('loading-screen').style.display = 'block';
            
            // 2. 🌟 關鍵不跳轉：直接讓內嵌 Iframe 去載入 GAS，把網址鎖在 GitHub 內部
            const iframe = document.getElementById('wms-app-frame');
            iframe.src = gasUrl;
            
            // 3. 當 Iframe 載入完成後，瞬間抽掉轉圈圈，顯示全螢幕 App
            iframe.onload = function() {
                document.getElementById('loading-screen').style.display = 'none';
                iframe.style.display = 'block';
            };
        }
    </script>
</body>
</html>
